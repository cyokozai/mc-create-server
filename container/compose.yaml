services:
  mc-create:
    container_name: ${CONTAINER_NAME}
    restart: always
    stdin_open: true
    tty: true
    image: itzg/minecraft-server:latest
    env_file:
      - .env
      - secret.env
    environment:
      TZ: Asia/Tokyo
      EULA: "TRUE"

      # --- Server Type ---
      TYPE: NEOFORGE
      VERSION: "1.21.1"
      NEOFORGE_VERSION: "21.1.248"

      # --- Server Settings ---
      DIFFICULTY: hard
      ONLINE_MODE: "TRUE"
      MAX_PLAYERS: 50
      ALLOW_FLIGHT: "TRUE"
      VIEW_DISTANCE: "30"
      MEMORY: ${SERVER_MEMORY:-8G}
      JVM_OPTS: "-Dminecraft.max_pages=5000 -Dforge.readTimeout=300"

      # --- RCON ---
      ENABLE_RCON: "TRUE"
      RCON_PORT: "25575"
      
# --- MOD maintenance (Modrinth) ---
      MODRINTH_PROJECTS: |
        # --- core / library ---
        architectury-api:13.0.11+neoforge
        dragonlib:1.21.1-beta-3.0.28
        fzzy-config:0.7.7+1.21+neoforge
        kotlin-for-forge:5.12.0
        # --- Create + addon ---
        create:6.0.10+mc1.21.1
        copycats:3.0.9+mc.1.21.1-neoforge
        create-aeronautics:1.3.2+mc1.21.1
        create-coasters-simulated:0.1.5
        create-electro-energetics:1.21.1-1.1.2
        create-power-loader:2.0.5-mc1.21.1
        create-railways-navigator:1.21.1-beta-0.10.0-C6
        create-steam-n-rails-1.21.1:0.2.1+neoforge-mc1.21.1
        create-stuff-additions:2.1.4.b
        createtrainwebapi:1.1.0
        deployer:0.1.3
        extra-gauges:2.1.3
        # --- gameplay / decoration ---
        corail-tombstone:neoforge-1.21.1-9.5.6
        immersive-paintings:0.7.9+1.21.1
        sable:2.0.5+mc1.21.1
        sophisticated-backpacks:1.21.1-3.26.6.2174
        sophisticated-core:1.21.1-1.5.2.2343
        # --- utility / server ---
        bluemap:5.7-neoforge
        emi:1.1.24+1.21.1+neoforge
        jade:15.10.6+neoforge
        worldedit:7.3.8
        # --- client side ---
        immediatelyfast:1.6.14+1.21.1-neoforge
        particle-core:0.3.3+1.21+neoforge

      # 全 slug を <slug>:<version> で固定している。
      # MODRINTH_DEFAULT_VERSION_TYPE は固定漏れが起きたときの保険としてのみ。
      # 更新は tools/lock-mods.py で行う
      MODRINTH_DEFAULT_VERSION_TYPE: release
      
      # --- MOD maintenance (CurseForge) ---
      CURSEFORGE_FILES: |
        309927:6529130   # = Curios API 9.5.1
        404465:9008089   # = FTB Library (NeoForge) 2101.1.37
        386134:8231400   # = FTB Ultimine (NeoForge) 2101.1.15
        32274:8923668    # = JourneyMap 6.0.9
        238222:8792638   # = Just Enough Items (JEI) 19.51.0.418
        1666057:8943256  # = Create: Station Voices 1.0.2
    ports:
      - "25565:25565/tcp"
      - "${WEB_BIND_IP:-127.0.0.1}:8100:8100/tcp"
      - "${WEB_BIND_IP:-127.0.0.1}:8080:8080/tcp"
    dns:
      - ${LOCAL_DNS:-8.8.8.8}
      - 1.1.1.1
    volumes:
      - ./minecraft/data:/data
      - ./minecraft/mods:/data/mods
      - ./image/server-icon.png:/data/server-icon.png
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    deploy:
      resources:
        limits:
          cpus: "3.5"
          memory: 30G

  backup:
    image: itzg/mc-backup:latest
    restart: unless-stopped
    depends_on:
      - mc-create
    env_file:
      - .env
      - secret.env
    environment:
      TZ: Asia/Tokyo
      BACKUP_NAME: "${CONTAINER_NAME}-backup"
      BACKUP_METHOD: tar
      BACKUP_ON_STARTUP: "TRUE"
      PRUNE_BACKUPS_DAYS: "5"
      CRON_SCHEDULE: "0 12 * * *"
      PAUSE_IF_NO_PLAYERS: "TRUE"
      PLAYERS_ONLINE_CHECK_INTERVAL: 5m
      INITIAL_DELAY: 2m
      RCON_HOST: localhost
      RCON_PORT: "25575"
      SERVER_HOST: ${SERVER_HOST_NAME:-localhost}
      DEST_DIR: /backups
      LINK_LATEST: "false"
      TAR_COMPRESS_METHOD: gzip
    volumes:
      - ./minecraft/data:/data:ro
      - ./minecraft/backups:/backups
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    network_mode: "service:mc-create"

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1280
